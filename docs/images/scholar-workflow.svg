<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">ScholarSearch 学者画像工作流</title>
  <desc id="desc">从多来源身份核验、Agent 并行分析、合作网络生成到证据审查和异步发布的工作流。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22332d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7d8b84"/>
    </marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2924}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#68756e}
      .phase{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:1px}
      .box-title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#202923}
      .body{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#536159}
      .flow-title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#202923}
      .flow{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#34433b}
    </style>
  </defs>

  <rect width="1440" height="700" rx="28" fill="#f4f3ee"/>
  <text class="title" x="60" y="64">从公开数据到可核验的学者画像</text>
  <text class="subtitle" x="60" y="94">多来源校验、Agent 分析与确定性证据门禁共同组成画像工作流</text>

  <g filter="url(#shadow)">
    <rect x="60" y="135" width="300" height="310" rx="22" fill="#edf5f8" stroke="#bdd8e4"/>
    <rect x="400" y="135" width="300" height="310" rx="22" fill="#fff3e9" stroke="#ebc9a9"/>
    <rect x="740" y="135" width="300" height="310" rx="22" fill="#edf7ef" stroke="#bcdcc4"/>
    <rect x="1080" y="135" width="300" height="310" rx="22" fill="#faedf3" stroke="#e8bfd0"/>
  </g>

  <text class="phase" x="88" y="173" fill="#4d8ea8">01 数据与身份</text>
  <text class="box-title" x="88" y="210">核验目标学者</text>
  <text class="body" x="88" y="252">OpenAlex 作者与论文</text>
  <text class="body" x="88" y="286">公开 ORCID 身份论文</text>
  <text class="body" x="88" y="320">Crossref DOI 出版信息</text>
  <text class="body" x="88" y="354">论文去重与多来源裁决</text>
  <text class="body" x="88" y="388">保守排除疑似同名论文簇</text>

  <text class="phase" x="428" y="173" fill="#c8793c">02 Agent 分析</text>
  <text class="box-title" x="428" y="210">理解研究内容</text>
  <text class="body" x="428" y="252">引用与年度趋势</text>
  <text class="body" x="428" y="286">细粒度研究方向</text>
  <text class="body" x="428" y="320">方向变化与研究轨迹</text>
  <text class="body" x="428" y="354">代表成果与画像总结</text>
  <text class="body" x="428" y="388">复杂任务按需升级模型</text>

  <text class="phase" x="768" y="173" fill="#4d9b66">03 关系与图谱</text>
  <text class="box-title" x="768" y="210">连接学者与机构</text>
  <text class="body" x="768" y="252">核心合作者与共同论文</text>
  <text class="body" x="768" y="286">可交互合作网络</text>
  <text class="body" x="768" y="320">研究阶段与方向迁移</text>
  <text class="body" x="768" y="354">同行、合作对象与机构</text>
  <text class="body" x="768" y="388">查询历史与持续追踪</text>

  <text class="phase" x="1108" y="173" fill="#bd6689">04 审查与发布</text>
  <text class="box-title" x="1108" y="210">只发布有依据的结论</text>
  <text class="body" x="1108" y="252">LLM 证据复核</text>
  <text class="body" x="1108" y="286">真实论文 ID 校验</text>
  <text class="body" x="1108" y="320">拒绝标题复述与空泛结论</text>
  <text class="body" x="1108" y="354">失败时保留最近成功画像</text>
  <text class="body" x="1108" y="388">发布 ScholarProfile</text>

  <line x1="365" y1="290" x2="390" y2="290" stroke="#7d8b84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="290" x2="730" y2="290" stroke="#7d8b84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1045" y1="290" x2="1070" y2="290" stroke="#7d8b84" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="60" y="500" width="1320" height="145" rx="22" fill="#fbfaf6" stroke="#d8dbd4"/>
  <text class="flow-title" x="88" y="538">后台任务与完成提醒</text>
  <text class="subtitle" x="88" y="566">搜索提交后由持久任务继续执行，页面只负责展示状态和接收完成通知</text>

  <g>
    <rect x="88" y="590" width="180" height="40" rx="20" fill="#e6efea"/>
    <rect x="335" y="590" width="180" height="40" rx="20" fill="#edf5f8"/>
    <rect x="582" y="590" width="180" height="40" rx="20" fill="#fff3e9"/>
    <rect x="829" y="590" width="180" height="40" rx="20" fill="#edf7ef"/>
    <rect x="1076" y="590" width="250" height="40" rx="20" fill="#faedf3"/>
    <text class="flow" x="178" y="616" text-anchor="middle">用户确认学者</text>
    <text class="flow" x="425" y="616" text-anchor="middle">PostgreSQL 排队</text>
    <text class="flow" x="672" y="616" text-anchor="middle">Worker + LangGraph</text>
    <text class="flow" x="919" y="616" text-anchor="middle">事务发布新画像</text>
    <text class="flow" x="1201" y="616" text-anchor="middle">SSE 通知并刷新页面</text>
    <line x1="275" y1="610" x2="325" y2="610" stroke="#7d8b84" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="522" y1="610" x2="572" y2="610" stroke="#7d8b84" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="769" y1="610" x2="819" y2="610" stroke="#7d8b84" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1016" y1="610" x2="1066" y2="610" stroke="#7d8b84" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
